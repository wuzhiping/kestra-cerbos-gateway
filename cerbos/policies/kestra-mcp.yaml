apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: default
  resource: kestra-mcp
  rules:
    # 仅允许账号访问自身资源（principal.id == resource.id）
    - actions: ["access"]
      effect: EFFECT_ALLOW
      roles: ["user"]
      condition:
        match:
          expr: request.principal.id == request.resource.id
