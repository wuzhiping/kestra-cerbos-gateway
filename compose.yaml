services:
  kestra-mcp:
    build: .
    container_name: kestra-mcp
    restart: always

    ports:
      - "8080:8080"

    environment:
      # Kestra 后端地址
      BACKEND_URL: "http://10.17.1.201:38080"

      # Kestra 租户（管理 API 需要）
      KESTRA_TENANT: "main"

      # 后端原有 Basic Auth（Base64）
      KESTRA_BASIC_AUTH: "d3UuemhpcGluZ0BmZWcuY246UEBzc3cwcmQxMTA="

      # Gateway 默认账号
      GATEWAY_USER: "u041007"

      # Gateway 各账号独立密码（格式：账号:密码,账号:密码；请替换为各账号真实密码）
      GATEWAY_USERS: "u041007:w041007,u199013:w199013"

      # Cerbos 策略引擎地址
      CERBOS_URL: "http://10.17.1.201:3592"
      CERBOS_ADMIN_USER: "cerbos"
      CERBOS_ADMIN_PASSWORD: "cerbosAdmin"

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"
      interval: 30s
      timeout: 5s
      retries: 3