services:
  mcp-pdp:
    build: .
    container_name: mcp-pdp
    restart: always

    ports:
      - "8080:8080"

    environment:
      KESTRA_BASIC_AUTH: "${KESTRA_BASIC_AUTH}"

      GATEWAY_USER: "u041007"
      GATEWAY_PASSWORD: "${GATEWAY_PASSWORD}"

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"
      interval: 30s
      timeout: 5s
      retries: 3